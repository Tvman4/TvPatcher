name: Build APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build TvPatcher
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing — generating Gradle 9.7.1 wrapper"

            gradle wrapper \
              --gradle-version 9.7.1 \
              --distribution-type bin
          fi

          chmod +x ./gradlew

      - name: Verify Gradle version
        shell: bash
        run: |
          ./gradlew --version

      - name: Clean build
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Build release APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec cp -v {} artifacts/ \;

          echo ""
          echo "===== APK ARTIFACTS ====="
          ls -lah artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TvPatcher-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
